name: Validate and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore last successful data snapshot
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: public/data/intelligence.json
          key: intelligence-${{ github.run_id }}
          restore-keys: intelligence-
      - name: Refresh open feeds, retain unavailable sources
        if: github.event_name != 'pull_request'
        run: npm run data:update
      - run: npm run data:validate
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve successful snapshot
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: public/data/intelligence.json
          key: intelligence-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
